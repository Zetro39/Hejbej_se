name: hejbej_se
description: Hejbej se – trasy v ČR s gamifikací.
publish_to: "none"
version: 1.2.3+146

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.1.1
  flutter_localizations:
    sdk: flutter
  geolocator: ^13.0.0
  pedometer: ^4.0.0
  shared_preferences: ^2.2.0
  google_maps_flutter: ^2.5.0
  http: ^1.6.0
  pay: ^3.3.0
  flutter_secure_storage: ^8.0.0
  google_sign_in: ^6.0.0
  sign_in_with_apple: ^6.0.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: any
  crypto: ^3.0.3
  camera: ^0.10.5
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  mobile_scanner: any
  home_widget: any
  share_plus: any
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  confetti: ^0.7.0
  flutter_tts: ^4.1.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_pay_config.json
    - assets/apple_pay_config.json
    - assets/map_style_light.json
    - assets/map_style_dark.json
    - assets/ambient_bg.mp3
